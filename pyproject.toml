[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-psychology-hangman"
version = "0.1.0"
description = "Bilingual terminal hangman game using psychology concepts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lucio" }]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "black"]

[project.scripts]
psycho-hangman = "psycho_hangman.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
psycho_hangman = ["data/*.json"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
